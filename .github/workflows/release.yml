# Авто-сборка и публикация релизов Chess.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Зависимости тестов
        run: npm install --no-save jsdom
      - name: Сборка и проверки
        run: |
          node build.js
          node test.js

  release-windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Веб-часть (index.html, sw.js с версией)
        run: node build.js
      - name: Зависимости обёртки
        working-directory: desktop
        run: npm install
      - name: Собрать и опубликовать релиз
        working-directory: desktop
        run: npx electron-builder --win --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
