# Draft build of the Tauri desktop wrapper.
# Manual trigger only: it does NOT run on tags yet, so normal Electron
# releases are unaffected. Once the first build is green, switch the
# trigger to tags (see TAURI.md, stage 3).
name: Tauri (draft build)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/tauri

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web bundle (index.html)
        run: node build.js

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop/tauri

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: chesster-tauri-${{ matrix.platform }}
          if-no-files-found: warn
          path: |
            desktop/tauri/target/release/bundle/**/*.msi
            desktop/tauri/target/release/bundle/**/*.exe
            desktop/tauri/target/release/bundle/**/*.deb
            desktop/tauri/target/release/bundle/**/*.rpm
            desktop/tauri/target/release/bundle/**/*.AppImage
